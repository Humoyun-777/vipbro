<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" type="image/png" href="vib.png">
    <title>Online Dokon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #050505;
            --card-bg: #111;
            --accent: #00d2ff;
            --text-gray: #a0a0a0;
            --border: #222;
            --edit-color: #f1c40f;
            --delete-color: #e74c3c;
            --success: #2ecc71;
            --overlay: rgba(0, 0, 0, 0.95);
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden; /* Gorizontal skrolni oldini oladi */
        }

        .hidden { display: none !important; }

        /* Banner styling */
        .banner-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 0;
            background: var(--dark-bg);
        }
        .banner-img {
            width: 95%; /* Mobil uchun biroz chetidan joy qoldiradi */
            max-width: 1200px;
            height: auto;
            display: block;
            border-radius: 15px;
        }

        #toast {
            position: fixed; top: 20px; right: 20px; padding: 15px 25px;
            border-radius: 12px; color: white; font-weight: bold;
            z-index: 9999; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateX(150%); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #toast.show { transform: translateX(0); }

        .confirm-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center;
            align-items: center; z-index: 5000; backdrop-filter: blur(8px);
        }
        .confirm-box {
            background: var(--card-bg); padding: 30px; border-radius: 20px;
            border: 1px solid var(--border); width: 90%; max-width: 350px; text-align: center;
            position: relative;
        }
        
        .close-modal {
            position: absolute; top: 15px; right: 15px; color: var(--text-gray);
            font-size: 20px; cursor: pointer; transition: 0.3s;
        }
        .close-modal:hover { color: var(--delete-color); }

        header {
            background: #0a0a0a; padding: 10px 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000;
        }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .search-box { flex: 1; margin: 0 15px; }
        .search-box input { 
            width: 100%; padding: 10px 15px; border-radius: 25px; 
            background: #151515; border: 1px solid var(--border); color: white; outline: none; transition: 0.3s;
            font-size: 14px;
        }

        #admin-panel { display: flex; flex-direction: row; min-height: 90vh; }
        .sidebar { width: 260px; background: #0a0a0a; border-right: 1px solid var(--border); padding: 25px; }
        .sidebar button { 
            width: 100%; padding: 14px; background: none; border: none; color: var(--text-gray); 
            text-align: left; cursor: pointer; border-radius: 12px; margin-bottom: 10px; 
            font-size: 15px; transition: 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .sidebar button.active { background: #151515; color: var(--accent); font-weight: bold; }

        .form-container { max-width: 600px; background: var(--card-bg); padding: 20px; border-radius: 25px; border: 1px solid var(--border); margin: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-gray); }
        
        input[type="text"], input[type="number"], input[type="password"] { 
            width: 100%; padding: 12px; background: #080808; border: 1px solid var(--border); 
            color: white; border-radius: 12px; outline: none; transition: 0.3s; box-sizing: border-box;
        }

        /* --- TUZATILGAN GRID VA CARD --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); /* Mobilda 2 ta ustun chiqishi uchun */
            gap: 15px; 
            padding: 15px; 
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 20px 5%; }
        }

        .product-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 15px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            height: 100%;
        }
        
        .img-container { 
            width: 100%; 
            aspect-ratio: 1 / 1; /* Kvadrat shakl */
            background: #000; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }
        .img-container img { width: 100%; height: 100%; object-fit: contain; }
        
        .card-logo-overlay {
            position: absolute; top: 8px; right: 8px; width: 25px; height: 25px;
            border-radius: 50%; border: 1px solid var(--accent); z-index: 10;
            background: rgba(0,0,0,0.5); padding: 2px;
        }

        .thumb-bar { display: flex; justify-content: center; gap: 4px; padding: 8px; background: #0a0a0a; overflow-x: auto; }
        .thumb-bar img { width: 35px; height: 35px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #333; flex-shrink: 0; }
        
        .info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .info h3 { margin: 5px 0; font-size: 15px; line-height: 1.2; }
        .price { font-size: 16px; font-weight: 800; color: var(--accent); margin: 5px 0; }

        .btn { 
            padding: 10px; background: var(--accent); border: none; font-weight: 800; 
            border-radius: 10px; cursor: pointer; color: black; transition: 0.3s; 
            width: 100%; font-size: 13px; margin-top: auto;
        }
        /* ---------------------------- */

        .tg-link {
            display: inline-block; color: #0088cc; text-decoration: none;
            font-size: 11px; margin-bottom: 8px; font-weight: 600;
        }

        footer { background: #080808; padding: 30px 5% 20px; border-top: 1px solid var(--border); margin-top: auto; }
        .footer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
        @media (min-width: 768px) { .footer-grid { grid-template-columns: repeat(3, 1fr); } }
        
        .footer-col h4 { color: var(--accent); margin-bottom: 10px; font-size: 11px; text-transform: uppercase; }
        .footer-col p, .footer-col a { color: var(--text-gray); text-decoration: none; font-size: 11px; margin-bottom: 5px; display: block; }
        .social-icons { display: flex; gap: 8px; margin-top: 10px; }
        .social-icons a { font-size: 16px; color: white; background: #1a1a1a; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }

        .admin-link { color: #222; cursor: pointer; font-size: 10px; transition: 0.3s; }

        @media (max-width: 768px) {
            #admin-panel { flex-direction: column; }
            .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 10px; gap: 10px; box-sizing: border-box; }
            .sidebar button { white-space: nowrap; margin-bottom: 0; padding: 10px 15px; }
            .banner-container { padding: 5px 0; }
        }
    </style>
</head>
<body>

    <div id="toast">Xabar</div>

    <div id="confirm-modal" class="confirm-overlay hidden">
        <div class="confirm-box">
            <h3 style="margin-top:0">O'chirilsinmi?</h3>
            <p style="color:var(--text-gray); font-size:14px">Ushbu amalni ortga qaytarib bo'lmaydi.</p>
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button class="btn" style="flex: 1; background: #222; color: white;" onclick="closeConfirm()">BEKOR</button>
                <button id="final-delete-btn" class="btn" style="flex: 1; background: var(--delete-color); color: white;">O'CHIRISH</button>
            </div>
        </div>
    </div>

    <div id="login-modal" class="confirm-overlay hidden" style="z-index: 2001;">
        <div class="confirm-box" style="max-width: 320px;">
            <i class="fas fa-times close-modal" onclick="closeLogin()"></i>
            <h2 style="color:var(--accent); margin-bottom: 20px;">Admin Kirish</h2>
            <input type="text" id="admin-user" placeholder="Login" style="margin-bottom:10px">
            <input type="password" id="admin-pass" placeholder="Parol">
            <button class="btn" style="width: 100%; margin-top: 20px;" onclick="checkLogin()">KIRISH</button>
        </div>
    </div>

    <header id="main-header">
        <a href="#" onclick="location.reload()"><img src="vib.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/50'"></a>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Qidirish..." oninput="searchProducts()">
        </div>
    </header>

    <div class="banner-container">
        <img src="baner1.png" alt="Banner" class="banner-img">
    </div>

    <div id="user-panel">
        <div id="user-grid" class="grid">Yuklanmoqda...</div>
    </div>

    <div id="admin-panel" class="hidden">
        <div class="sidebar">
            <button id="tab1" class="active" onclick="toggleTab('add')"><i class="fas fa-plus-circle"></i> Qo'shish</button>
            <button id="tab2" onclick="toggleTab('list')"><i class="fas fa-box-open"></i> Ro'yxat</button>
            <button onclick="location.reload()" style="color: var(--delete-color); margin-top: auto;"><i class="fas fa-sign-out-alt"></i> Chiqish</button>
        </div>
        
        <div style="flex: 1; padding: 15px; overflow-y: auto;">
            <div id="add-view">
                <h2 id="form-title" style="margin-bottom: 20px; font-size: 20px;">✨ Yangi mahsulot</h2>
                <div class="form-container">
                    <input type="hidden" id="p-id">
                    
                    <div class="form-group">
                        <label>Rasm URL manzillari</label>
                        <input type="text" id="p-img1" placeholder="Asosiy rasm" style="margin-bottom: 8px;">
                        <input type="text" id="p-img2" placeholder="Rasm 2" style="margin-bottom: 8px;">
                        <input type="text" id="p-img3" placeholder="Rasm 3" style="margin-bottom: 8px;">
                        <input type="text" id="p-img4" placeholder="Rasm 4">
                    </div>

                    <div class="form-group">
                        <label>Mahsulot nomi</label>
                        <input type="text" id="p-name" placeholder="iPhone 15 Pro">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label>Narxi</label>
                            <input type="text" id="p-price" placeholder="12 000 000">
                        </div>
                        <div class="form-group">
                            <label>Soni</label>
                            <input type="number" id="p-qty" placeholder="10">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Kategoriya</label>
                        <input type="text" id="p-cat" placeholder="Smartfonlar">
                    </div>

                    <button class="btn" style="height: 50px; margin-top: 10px;" onclick="saveProduct()">SAQLASH</button>
                </div>
            </div>

            <div id="list-view" class="hidden">
                <h2 style="margin-bottom: 20px; font-size: 20px;">📦 Ro'yxat</h2>
                <div id="admin-grid" class="grid" style="padding: 0;"></div>
            </div>
        </div>
    </div>

    <footer id="main-footer">
        <div class="footer-grid">
            <div class="footer-col">
                <h4>BIZ HAQIMIZDA</h4>
                <p><strong>Vip Bro</strong> - Sifat va tezkor yetkazib berish.</p>
                <div class="social-icons">
                    <a href="https://t.me/+QoEHYGE2GFQ2NTJi"><i class="fab fa-telegram"></i></a>
                    <a href="https://www.instagram.com/vip.bro__"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
            <div class="footer-col">
                <h4>ALOQA</h4>
                <p><i class="fas fa-phone"></i> +998901234567</p>
                <p><i class="fas fa-map-marker-alt"></i> Toshkent</p>
            </div>
        </div>
        <div style="border-top: 1px solid #222; padding-top: 20px; display: flex; justify-content: space-between; align-items: center;">
            <p style="color: #444; font-size: 10px;">&copy; 2026 VIP BRO.</p>
            <span class="admin-link" onclick="openLogin()">ADMIN PANEL</span>
        </div>
    </footer>

    <script>
        const API_URL = "https://690b2ee56ad3beba00f3cf78.mockapi.io/Market";
        let products = [];
        let editMode = false;
        let deleteId = null;

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.background = type === 'success' ? 'var(--success)' : 'var(--delete-color)';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function fetchProducts() {
            try {
                const res = await fetch(API_URL);
                products = await res.json();
                render(products);
            } catch (err) { showToast("Xato!", 'error'); }
        }

        function openLogin() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLogin() { document.getElementById('login-modal').classList.add('hidden'); }

        function checkLogin() {
            if(document.getElementById('admin-user').value === 'admin' && 
               document.getElementById('admin-pass').value === 'negir') {
                 closeLogin();
                 document.getElementById('user-panel').classList.add('hidden');
                 document.getElementById('main-header').classList.add('hidden');
                 document.getElementById('main-footer').classList.add('hidden');
                 document.querySelector('.banner-container').classList.add('hidden');
                 document.getElementById('admin-panel').classList.remove('hidden');
                 showToast("Xush kelibsiz!"); fetchProducts();
            } else { showToast("Parol xato!", 'error'); }
        }

        function changeImg(el, newSrc) {
            const container = el.closest('.product-card').querySelector('.main-img');
            container.src = newSrc;
            el.parentElement.querySelectorAll('img').forEach(img => img.classList.remove('active'));
            el.classList.add('active');
        }

        function render(data) {
            const ugrid = document.getElementById('user-grid');
            const agrid = document.getElementById('admin-grid');
            ugrid.innerHTML = ''; agrid.innerHTML = '';

            data.forEach(p => {
                const imgs = [p.img1, p.img2, p.img3, p.img4].filter(src => src && src.trim() !== "");
                const primaryImg = imgs[0] || 'https://via.placeholder.com/250';
                const qtyText = (p.qty == 0 || !p.qty) ? "Cheksiz" : p.qty + " ta";

                let thumbHtml = '';
                if(imgs.length > 1) {
                    thumbHtml = `<div class="thumb-bar">` + 
                        imgs.map((src, i) => `<img src="${src}" class="${i===0?'active':''}" onclick="changeImg(this, '${src}')" onerror="this.style.display='none'">`).join('') + 
                        `</div>`;
                }

                const cardBase = `
                    <div class="product-card">
                        <img src="vib.png" class="card-logo-overlay" onerror="this.style.display='none'">
                        <div class="img-container">
                            <img src="${primaryImg}" class="main-img" onerror="this.src='https://via.placeholder.com/250'">
                        </div>
                        ${thumbHtml}
                        <div class="info">
                            <small style="color:var(--accent); font-size:10px">${p.cat || 'Premium'}</small>
                            <h3>${p.name}</h3>
                            <div class="price">${p.price} so'm</div>
                            <a href="https://t.me/+QoEHYGE2GFQ2NTJi" target="_blank" class="tg-link">
                                <i class="fab fa-telegram"></i> Telegramda ko'rish
                            </a>
                            <p style="font-size:10px; color:gray; margin-top:2px">Omborda: ${qtyText}</p>
                `;

                ugrid.innerHTML += cardBase + `<a target="_blank" href="https://t.me/+QoEHYGE2GFQ2NTJi" style="text-decoration:none"><button class="btn">SOTIB OLISH</button></a></div></div>`;
                
                agrid.innerHTML += cardBase + `
                    <div style="display:flex; gap:5px; margin-top:10px">
                        <button onclick="editProduct(${p.id})" style="flex:1; background:var(--edit-color); border:none; padding:8px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:11px">Tahrir</button>
                        <button onclick="openConfirm(${p.id})" style="flex:1; background:var(--delete-color); color:white; border:none; padding:8px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:11px">O'chirish</button>
                    </div></div></div>`;
            });
        }

        async function saveProduct() {
            const id = document.getElementById('p-id').value;
            const item = {
                img1: document.getElementById('p-img1').value,
                img2: document.getElementById('p-img2').value,
                img3: document.getElementById('p-img3').value,
                img4: document.getElementById('p-img4').value,
                name: document.getElementById('p-name').value,
                price: document.getElementById('p-price').value,
                qty: document.getElementById('p-qty').value || 0,
                cat: document.getElementById('p-cat').value
            };

            if(!item.name || !item.price || !item.img1) return showToast("Nom, narx va rasm shart!", "error");

            const method = editMode ? 'PUT' : 'POST';
            const url = editMode ? `${API_URL}/${id}` : API_URL;
            
            showToast("Saqlanmoqda...");
            try {
                await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(item) });
                showToast("Muvaffaqiyatli saqlandi!");
                resetForm();
                await fetchProducts();
                toggleTab('list');
            } catch(e) { showToast("Xatolik yuz berdi", "error"); }
        }

        function resetForm() {
            document.getElementById('p-id').value = "";
            document.getElementById('p-img1').value = "";
            document.getElementById('p-img2').value = "";
            document.getElementById('p-img3').value = "";
            document.getElementById('p-img4').value = "";
            document.getElementById('p-name').value = "";
            document.getElementById('p-price').value = "";
            document.getElementById('p-qty').value = "";
            document.getElementById('p-cat').value = "";
            editMode = false;
            document.getElementById('form-title').innerText = "✨ Yangi mahsulot";
        }

        function editProduct(id) {
            const p = products.find(x => x.id == id);
            document.getElementById('p-id').value = p.id;
            document.getElementById('p-img1').value = p.img1 || "";
            document.getElementById('p-img2').value = p.img2 || "";
            document.getElementById('p-img3').value = p.img3 || "";
            document.getElementById('p-img4').value = p.img4 || "";
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-qty').value = p.qty;
            document.getElementById('p-cat').value = p.cat;
            editMode = true;
            document.getElementById('form-title').innerText = "📝 " + p.name;
            toggleTab('add');
        }

        function openConfirm(id) { deleteId = id; document.getElementById('confirm-modal').classList.remove('hidden'); }
        function closeConfirm() { document.getElementById('confirm-modal').classList.add('hidden'); }

        document.getElementById('final-delete-btn').onclick = async () => {
            await fetch(`${API_URL}/${deleteId}`, { method: 'DELETE' });
            showToast("O'chirildi", 'error');
            closeConfirm(); fetchProducts();
        };

        function toggleTab(tab) {
            document.getElementById('add-view').classList.toggle('hidden', tab !== 'add');
            document.getElementById('list-view').classList.toggle('hidden', tab !== 'list');
            document.getElementById('tab1').classList.toggle('active', tab === 'add');
            document.getElementById('tab2').classList.toggle('active', tab === 'list');
            if(tab === 'add' && !editMode) resetForm();
        }

        function searchProducts() {
            const q = document.getElementById('search-input').value.toLowerCase();
            render(products.filter(p => p.name.toLowerCase().includes(q)));
        }

        fetchProducts();
    </script>
</body> 
</html>
